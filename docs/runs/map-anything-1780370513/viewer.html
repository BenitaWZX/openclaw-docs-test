<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Point Cloud Viewer · mapanything_sg_stadium.ply</title>
<style>
  body{margin:0;overflow:hidden;background:#0d0d12;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#e8e8f8;}
  #info{position:absolute;top:12px;left:12px;z-index:10;background:rgba(13,13,18,0.8);padding:8px 14px;border-radius:8px;font-size:12px;pointer-events:none;}
  #info a{color:#60a5fa;pointer-events:auto;}
  #controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;}
  #controls button{background:rgba(26,26,36,0.85);border:1px solid #2a2a3a;color:#e8e8f8;padding:6px 14px;border-radius:6px;font-size:11px;cursor:pointer;}
  #controls button:hover{background:#2a2a3a;}
  #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;}
  #loading .spinner{width:32px;height:32px;border:3px solid #2a2a3a;border-top-color:#7c6af7;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{font-size:12px;color:#606080;}
  #error{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;color:#f87171;font-size:13px;text-align:center;display:none;}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Loading point cloud…</p></div>
<div id="error">Failed to load PLY</div>
<div id="info">mapanything_sg_stadium.ply · <span id="pt-count">—</span> points</div>
<div id="controls">
  <button onclick="resetView()">↺ Reset View</button>
  <button onclick="toggleSize()">◉ Toggle Size</button>
  <button onclick="cycleColor()">🎨 Cycle Color</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.8;
controls.target.set(0, 0, 0);

// Lights
scene.add(new THREE.AmbientLight(0x404060));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(1, 2, 1);
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0x8888ff, 0.3).position.set(-1, -1, -1));

let points = null;
let pointSize = 4.0;
let colorIndex = 0;
const colors = [0x7c6af7, 0x4ade80, 0xfbbf24, 0xf87171, 0x60a5fa, 0x2dd4bf, 0xffffff];

const url = new URLSearchParams(location.search).get('url');
if (!url) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').textContent = 'No ?url= parameter provided';
}

async function loadPLY() {
  try {
    const loader = new PLYLoader();
    const geometry = await loader.loadAsync(url);

    // Normalize scale
    geometry.computeBoundingBox();
    const box = geometry.boundingBox;
    const center = new THREE.Vector3();
    box.getCenter(center);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 10 / maxDim;

    const positions = geometry.attributes.position;
    const vertexCount = positions.count;
    document.getElementById('pt-count').textContent = vertexCount.toLocaleString();

    // Center and scale
    for (let i = 0; i < vertexCount; i++) {
      positions.setXYZ(i,
        (positions.getX(i) - center.x) * scale,
        (positions.getY(i) - center.y) * scale,
        (positions.getZ(i) - center.z) * scale
      );
    }
    positions.needsUpdate = true;

    // Create the material
    const material = new THREE.PointsMaterial({
      color: colors[colorIndex],
      size: pointSize,
      sizeAttenuation: true,
    });
    points = new THREE.Points(geometry, material);
    scene.add(points);

    // Move camera back
    camera.position.set(8, 6, 12);
    controls.target.set(0, 0, 0);
    controls.update();

    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Error: ' + e.message;
  }
}

window.resetView = function() {
  camera.position.set(8, 6, 12);
  controls.target.set(0, 0, 0);
  controls.update();
};

window.toggleSize = function() {
  pointSize = pointSize === 4.0 ? 1.5 : 4.0;
  if (points) points.material.size = pointSize;
};

window.cycleColor = function() {
  colorIndex = (colorIndex + 1) % colors.length;
  if (points) points.material.color.setHex(colors[colorIndex]);
};

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

loadPLY().then(animate);
</script>
</body>
</html>
